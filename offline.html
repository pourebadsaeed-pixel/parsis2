<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پارسیس — آفلاین</title>
<style>
  body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(160deg, #eef4fb, #e6eef9);
    color: #0f172a;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; text-align: center; padding: 20px;
  }
  .box {
    background: #fff; border-radius: 24px; padding: 40px 30px;
    max-width: 420px; box-shadow: 0 20px 50px rgba(15,23,42,0.14);
  }
  .icon { font-size: 4rem; margin-bottom: 16px; }
  h1 { color: #4a90e2; font-size: 1.4rem; margin-bottom: 10px; }
  p { color: #64748b; font-size: 0.9rem; line-height: 1.9; margin-bottom: 20px; }
  button {
    background: linear-gradient(135deg, #4a90e2, #6366f1);
    color: #fff; border: none; padding: 12px 28px;
    border-radius: 12px; font-family: inherit; font-size: 0.9rem;
    font-weight: 800; cursor: pointer;
  }
</style>
</head>
<body>
<div class="box">
  <div class="icon">📡</div>
  <h1>اتصال اینترنت قطع است</h1>
  <p>
    پارسیس در حالت آفلاین کار می‌کند، اما این صفحه هنوز در حافظه‌ی نهان ذخیره نشده است.<br>
    لطفاً اتصال خود را بررسی کنید و دوباره امتحان کنید.
  </p>
  <button onclick="location.reload()">🔄 تلاش مجدد</button>
</div>
</body>
</html>
