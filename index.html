<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a73e8">
    <meta name="description" content="پارسیس ۲ - سیستم جامع حسابداری و مدیریت مالی">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="پارسیس ۲">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-96x96.png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/components.css">
    <title>پارسیس ۲ | سیستم حسابداری</title>
</head>
<body>
    <!-- لودر اولیه -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <p>در حال بارگذاری پارسیس ۲...</p>
    </div>

    <!-- اپلیکیشن -->
    <div id="app" hidden>
        <!-- سایدبار -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>پارسیس ۲</h1>
                <button class="close-sidebar" id="close-sidebar">×</button>
            </div>
            <nav class="sidebar-nav">
                <a href="#dashboard" class="nav-item" data-page="dashboard">
                    <span class="nav-icon">📊</span><span>داشبورد</span>
                </a>
                <a href="#persons" class="nav-item" data-page="persons">
                    <span class="nav-icon">👥</span><span>اشخاص</span>
                </a>
                <a href="#products" class="nav-item" data-page="products">
                    <span class="nav-icon">📦</span><span>کالا و خدمات</span>
                </a>
                <a href="#accounts" class="nav-item" data-page="accounts">
                    <span class="nav-icon">🏦</span><span>حساب‌ها</span>
                </a>
                <a href="#vouchers" class="nav-item" data-page="vouchers">
                    <span class="nav-icon">📝</span><span>اسناد حسابداری</span>
                </a>
                <a href="#invoices" class="nav-item" data-page="invoices">
                    <span class="nav-icon">🧾</span><span>فاکتورها</span>
                </a>
                <a href="#receipts" class="nav-item" data-page="receipts">
                    <span class="nav-icon">💰</span><span>دریافت/پرداخت</span>
                </a>
                <a href="#reports" class="nav-item" data-page="reports">
                    <span class="nav-icon">📈</span><span>گزارشات</span>
                </a>
                <a href="#settings" class="nav-item" data-page="settings">
                    <span class="nav-icon">⚙️</span><span>تنظیمات</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <span>نسخه ۱.۰.۰</span>
            </div>
        </aside>

        <!-- هدر موبایل -->
        <header class="mobile-header">
            <button class="hamburger" id="hamburger">☰</button>
            <span class="mobile-title">پارسیس ۲</span>
            <button class="btn-install" id="btn-install" hidden>نصب</button>
        </header>

        <!-- محتوای اصلی -->
        <main class="main-content" id="main-content">
            <div class="page-container" id="page-container">
                <!-- محتوای صفحات به صورت داینامیک بارگذاری می‌شود -->
            </div>
        </main>

        <!-- اورلی سایدبار (موبایل) -->
        <div class="overlay" id="overlay"></div>
    </div>

    <!-- مودال عمومی -->
    <div class="modal" id="modal" hidden>
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">عنوان</h3>
                <button class="modal-close" id="modal-close">×</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <!-- توست -->
    <div id="toast-container"></div>

    <script src="./js/utils.js"></script>
    <script src="./js/db.js"></script>
    <script src="./js/pages/dashboard.js"></script>
    <script src="./js/pages/persons.js"></script>
    <script src="./js/pages/products.js"></script>
    <script src="./js/pages/accounts.js"></script>
    <script src="./js/pages/vouchers.js"></script>
    <script src="./js/pages/invoices.js"></script>
    <script src="./js/pages/receipts.js"></script>
    <script src="./js/pages/reports.js"></script>
    <script src="./js/pages/settings.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
