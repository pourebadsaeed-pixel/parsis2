           * ✅ v2.1.0 — تنظیمات هر ویجت (فونت/رنگ/پس‌زمینه) + آیکن ⚙ داخل ویجت:
           *   • هر ویجت تنظیمات مستقل در SharedPreferences «parsis_widget_cfg» دارد
           *     (کلید: cfg_<appWidgetId>) که از WidgetConfigActivity ذخیره می‌شود.
           *   • آیکن ⚙ گوشه ویجت همان تنظیمات را مستقیم باز می‌کند.
           */
          public abstract class ParsisWidgetProvider extends AppWidgetProvider {

              protected abstract int layoutId();
              protected abstract String sectionKey();
              protected abstract int maxRows();
              protected abstract boolean hasTotal();
              protected abstract String titleText();
              protected abstract String emptyText();

              /* ---------- خواندن اسنپ‌شات ---------- */
              static JSONObject readSnapshot(Context ctx) {
                  FileInputStream fis = null;
                  try {
                      fis = ctx.openFileInput("widget-snapshot.json");
                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096];
                      int n;
                      while ((n = fis.read(buf)) > 0) bos.write(buf, 0, n);
                      return new JSONObject(bos.toString("UTF-8"));
                  } catch (Exception e) {
                      return new JSONObject();
                  } finally {
                      if (fis != null) try { fis.close(); } catch (Exception e2) {}
                  }
              }

              /* ---------- ✅ v2.1.0 — تنظیمات هر ویجت ---------- */
              public static JSONObject readCfg(Context ctx, int appWidgetId) {
                  try {
                      SharedPreferences sp = ctx.getSharedPreferences("parsis_widget_cfg", Context.MODE_PRIVATE);
                      String raw = sp.getString("cfg_" + appWidgetId, null);
                      if (raw != null) return new JSONObject(raw);
                  } catch (Exception e) {}
                  JSONObject def = new JSONObject();
                  try {
                      def.put("scale", 1.0);          /* ضریب اندازه فونت */
                      def.put("showTitle", true);     /* نمایش عنوان */
                      def.put("textColor", 0);        /* 0 = رنگ پیش‌فرض لایه */
                      def.put("valColor", 0);         /* رنگ مقادیر/مبالغ */
                      def.put("bgColor", 0);          /* 0 = پس‌زمینه پیش‌فرض (drawable) */
                  } catch (Exception e) {}
                  return def;
              }

              public static void writeCfg(Context ctx, int appWidgetId, JSONObject cfg) {
                  try {
                      SharedPreferences sp = ctx.getSharedPreferences("parsis_widget_cfg", Context.MODE_PRIVATE);
                      sp.edit().putString("cfg_" + appWidgetId, cfg.toString()).apply();
                  } catch (Exception e) {}
              }

              /* ---------- بازکردن اپ با کلیک روی ویجت ---------- */
              private PendingIntent openApp(Context ctx) {
                  Intent it = new Intent(ctx, MainActivity.class);
                  it.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  int rc = 1000 + sectionKey().hashCode();
                  return PendingIntent.getActivity(ctx, rc, it,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              /* ---------- ✅ v2.1.0 — بازکردن تنظیمات با کلیک روی ⚙ ---------- */
              private PendingIntent openConfig(Context ctx, int appWidgetId) {
                  Intent it = new Intent(ctx, WidgetConfigActivity.class);
                  it.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId);
                  it.putExtra("providerClass", this.getClass().getName());
                  it.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  int rc = 2000 + appWidgetId;
                  return PendingIntent.getActivity(ctx, rc, it,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              /* ---------- رندر ---------- */
              public void push(Context ctx) {
                  AppWidgetManager mgr = AppWidgetManager.getInstance(ctx);
                  int[] ids = mgr.getAppWidgetIds(new ComponentName(ctx, this.getClass()));
                  if (ids == null || ids.length == 0) return;
                  JSONObject snap = readSnapshot(ctx);
                  for (int id : ids) {
                      mgr.updateAppWidget(id, buildViews(ctx, snap, id));
                  }
              }

              @Override
              public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
                  push(ctx);
              }

              private RemoteViews buildViews(Context ctx, JSONObject snap, int appWidgetId) {
                  String pkg = ctx.getPackageName();
                  RemoteViews rv = new RemoteViews(pkg, layoutId());

                  rv.setOnClickPendingIntent(R.id.w_root, openApp(ctx));

                  /* ✅ v2.1.0 — آیکن تنظیمات داخل ویجت */
                  int gearId = resId(ctx, "w_settings");
                  if (gearId != 0) {
                      rv.setOnClickPendingIntent(gearId, openConfig(ctx, appWidgetId));
                  }

                  JSONObject cfg = readCfg(ctx, appWidgetId);
                  double scale = cfg.optDouble("scale", 1.0);
                  if (scale <= 0) scale = 1.0;
                  boolean showTitle = cfg.optBoolean("showTitle", true);
                  int textColor = cfg.optInt("textColor", 0);
                  int valColor = cfg.optInt("valColor", 0);
                  int bgColor = cfg.optInt("bgColor", 0);

                  rv.setTextViewText(R.id.w_title, titleText());
                  rv.setViewVisibility(R.id.w_title, showTitle ? View.VISIBLE : View.GONE);
                  rv.setTextViewText(R.id.w_date, snap.optString("updatedAt", ""));

                  /* اندازه و رنگ عنوان و تاریخ */
                  rv.setTextViewTextSize(R.id.w_title, TypedValue.COMPLEX_UNIT_SP, (float) (13 * scale));
                  rv.setTextViewTextSize(R.id.w_date, TypedValue.COMPLEX_UNIT_SP, (float) (9 * scale));
                  if (textColor != 0) {
                      rv.setTextColor(R.id.w_title, textColor);
                      rv.setTextColor(R.id.w_date, (textColor & 0x00FFFFFF) | 0xB3000000);
                  }
                  if (!showTitle) {
                      rv.setViewVisibility(R.id.w_date, View.VISIBLE);
                  }

                  JSONObject sec = snap.optJSONObject(sectionKey());
                  JSONArray rows = (sec == null) ? null : sec.optJSONArray("rows");

                  int shown = 0;
                  if (rows != null) {
                      for (int i = 0; i < rows.length() && shown < maxRows(); i++) {
                          JSONObject r = rows.optJSONObject(i);
                          if (r == null) continue;
                          int slot = shown + 1;
                          int rid = resId(ctx, "row" + slot);
                          int tId = resId(ctx, "row" + slot + "_t");
                          int vId = resId(ctx, "row" + slot + "_v");
                          int sId = resId(ctx, "row" + slot + "_s");
                          if (rid == 0 || tId == 0 || vId == 0) continue;

                          rv.setViewVisibility(rid, View.VISIBLE);
                          rv.setTextViewText(tId, r.optString("t", ""));
                          rv.setTextViewText(vId, r.optString("v", ""));
                          rv.setTextViewTextSize(tId, TypedValue.COMPLEX_UNIT_SP, (float) (12 * scale));
                          rv.setTextViewTextSize(vId, TypedValue.COMPLEX_UNIT_SP, (float) (12 * scale));
                          if (textColor != 0) rv.setTextColor(tId, textColor);
                          if (valColor != 0) rv.setTextColor(vId, valColor);
                          String s = r.optString("s", "");
                          if (sId != 0) {
                              if (s.length() > 0) {
                                  rv.setTextViewText(sId, s);
                                  rv.setViewVisibility(sId, View.VISIBLE);
                                  rv.setTextViewTextSize(sId, TypedValue.COMPLEX_UNIT_SP, (float) (9 * scale));
                                  if (textColor != 0) rv.setTextColor(sId, (textColor & 0x00FFFFFF) | 0x99000000);
                              } else {
                                  rv.setViewVisibility(sId, View.GONE);
                              }
                          }
                          shown++;
                      }
                  }

                  /* پنهان کردن اسلات‌های خالی */
                  for (int i = shown; i < maxRows(); i++) {
                      int rid = resId(ctx, "row" + (i + 1));
                      if (rid != 0) rv.setViewVisibility(rid, View.GONE);
                  }

                  /* ردیف جمع کل (فقط بانک/صندوق) */
                  if (hasTotal()) {
                      int trId = resId(ctx, "w_total_row");
                      int ttId = resId(ctx, "w_total");
                      if (trId != 0 && ttId != 0) {
                          String total = (sec == null) ? "" : sec.optString("total", "");
                          boolean has = total.length() > 0 && !"—".equals(total);
                          rv.setViewVisibility(trId, has ? View.VISIBLE : View.GONE);
                          if (has) {
                              rv.setTextViewText(ttId, "جمع کل: " + total);
                              rv.setTextViewTextSize(ttId, TypedValue.COMPLEX_UNIT_SP, (float) (12 * scale));
                              if (valColor != 0) rv.setTextColor(ttId, valColor);
                          }
                      }
                  }

                  /* حالت خالی */
                  boolean empty = shown == 0;
                  rv.setViewVisibility(R.id.w_empty, empty ? View.VISIBLE : View.GONE);
                  rv.setTextViewText(R.id.w_empty, emptyText());
                  rv.setTextViewTextSize(R.id.w_empty, TypedValue.COMPLEX_UNIT_SP, (float) (11 * scale));
                  if (textColor != 0) rv.setTextColor(R.id.w_empty, (textColor & 0x00FFFFFF) | 0x99000000);

                  /* ✅ v2.1.0 — رنگ پس‌زمینه دلخواه (۰ = پیش‌فرض drawable) */
                  if (bgColor != 0) {
                      rv.setInt(R.id.w_root, "setBackgroundColor", bgColor);
                  }

                  return rv;
              }

              private static int resId(Context ctx, String name) {
                  return ctx.getResources().getIdentifier(name, "id", ctx.getPackageName());
              }

              /* ---------- رفرش همه ویجت‌ها از پلاگین / تنظیمات ---------- */
              public static void refreshAll(Context ctx) {
                  try { new BankWidgetProvider().push(ctx); } catch (Exception e) {}
                  try { new CashWidgetProvider().push(ctx); } catch (Exception e) {}
                  try { new AgendaWidgetProvider().push(ctx); } catch (Exception e) {}
                  try { new SummaryWidgetProvider().push(ctx); } catch (Exception e) {}
                  try { new NotesWidgetProvider().push(ctx); } catch (Exception e) {}
                  try { new FacilityWidgetProvider().push(ctx); } catch (Exception e) {}
              }
          }
