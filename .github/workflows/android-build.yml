#  پارسیس — ساخت خودکار APK از سورس گیت‌هاب (بدون کار دستی روی فایل اندروید)
#  مسیر: .github/workflows/android-build.yml
#
#  چه زمانی اجرا می‌شود؟
#    • دستی: تب Actions ← Build Android APK ← Run workflow
#    • خودکار: هر بار یک تگ مثل v2.2.0 پوش کنید
#
#  امضای APK (یک‌بار برای همیشه):
#    در Settings ← Secrets and variables ← Actions چهار Secret بسازید:
#      KEYSTORE_BASE64  /  KEYSTORE_PASSWORD  /  KEY_ALIAS  /  KEY_PASSWORD
#    اگر Secret ها تعریف نشوند، APK به‌صورت Debug و بدون امضا ساخته می‌شود.
#  ============================================================
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      #  نکته: در شرط if نمی‌توان مستقیماً از secrets استفاده کرد (محدودیت GitHub)،
      #  برای همین مقدار Secret اول به متغیر env داده می‌شود و شرط را bash بررسی می‌کند.
      - name: Decode keystore (optional)
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
            echo "Keystore decoded OK"
          else
            echo "No keystore secret found - will build DEBUG apk"
          fi

      - name: Build Release APK (signed) or Debug fallback
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -f app/release.keystore ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: parsis-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
