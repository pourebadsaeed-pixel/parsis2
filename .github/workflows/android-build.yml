          python3 - <<'PY'
          import re
          sp = 'android/app/src/main/res/values/strings.xml'
          s = open(sp, encoding='utf-8').read()
          add = []
          for k in ['widget_bank', 'widget_cash', 'widget_agenda', 'widget_cal', 'widget_summary', 'widget_notes', 'widget_facility']:
              name = k + '_desc'
              if name not in s:
                  add.append(f"    <string name=\"{name}\">{k}</string>".replace('{k}', name.replace('_', ' ')))
          if add:
              s = s.replace('</resources>', '\n' + '\n'.join(add) + '\n</resources>')
              open(sp, 'w', encoding='utf-8').write(s)
          print('strings patched:', len(add))
