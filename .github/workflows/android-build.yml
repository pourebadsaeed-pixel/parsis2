          package ir.parsis.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.telephony.SmsMessage;

          import com.getcapacitor.Bridge;

          import org.json.JSONArray;
          import org.json.JSONObject;

          /**
           * دریافت پیامک‌های ورودی اندروید:
           *  ۱) ذخیره در بافر دائمی (SharedPreferences) — حتی اگر اپ خاموش باشد
           *  ۲) اگر اپ باز است، ارسال فوری رویداد «parsisSmsReceived» به لایه وب
           */
          public class SmsReceiver extends BroadcastReceiver {

              private static final int MAX_BUFFER = 100;

              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null || !"android.provider.Telephony.SMS_RECEIVED".equals(intent.getAction())) return;
                  Bundle b = intent.getExtras();
                  if (b == null) return;

                  StringBuilder body = new StringBuilder();
                  String sender = "";
                  long ts = System.currentTimeMillis();

                  try {
                      Object[] pdus = (Object[]) b.get("pdus");
                      String format = b.getString("format");
                      if (pdus != null) {
                          for (int i = 0; i < pdus.length; i++) {
                              SmsMessage msg = SmsMessage.createFromPdu((byte[]) pdus[i], format);
                              if (msg == null) continue;
                              String part = msg.getDisplayMessageBody();
                              if (part != null) body.append(part);
                              if (i == 0) {
                                  String a = msg.getOriginatingAddress();
                                  if (a != null) sender = a;
                                  long mt = msg.getTimestampMillis();
                                  if (mt > 0) ts = mt;
                              }
                          }
                      }
                  } catch (Exception e) {
                      /* پیامک ناقص — صرف‌نظر */
                  }

                  String text = body.toString().trim();
                  if (text.length() == 0) return;

                  /* ۱) بافر دائمی */
                  try {
                      JSONObject o = new JSONObject();
                      o.put("body", text);
                      o.put("sender", sender);
                      o.put("ts", ts);

                      SharedPreferences sp = context.getSharedPreferences("parsis_sms", Context.MODE_PRIVATE);
                      JSONArray arr = new JSONArray(sp.getString("buffer", "[]"));
                      arr.put(o);
                      while (arr.length() > MAX_BUFFER) arr.remove(0);
                      sp.edit().putString("buffer", arr.toString()).apply();
                  } catch (Exception e2) {
                      /* بافر ناموفق — ادامه */
                  }

                  /* ۲) فوروارد زنده به وب (اگر اپ باز است) */
                  try {
                      Bridge br = MainActivity.staticBridge;
                      if (br != null) {
                          JSONObject payload = new JSONObject();
                          payload.put("body", text);
                          payload.put("sender", sender);
                          payload.put("ts", ts);
                          br.triggerJSEvent("parsisSmsReceived", "window", payload.toString());
                      }
                  } catch (Exception e3) {
                      /* اپ بسته است — پیامک در بافر می‌ماند */
                  }
              }
          }
