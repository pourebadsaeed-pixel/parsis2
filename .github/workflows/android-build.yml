              @PluginMethod
              public void saveFile(PluginCall call) {
                  Context ctx = getContext();
                  String name = call.getString("name");
                  String mime = call.getString("mime", "application/octet-stream");
                  String b64 = call.getString("base64");
                  if (ctx == null || name == null || name.length() == 0 || b64 == null || b64.length() == 0) {
                      call.reject("invalid-args"); return;
                  }
                  try {
                      String safeName = name.replaceAll("[\\\\/:*?\"<>|]", "-");
                      byte[] bytes = android.util.Base64.decode(b64, android.util.Base64.DEFAULT);
                      String uriOut = null;
                      boolean legacy = false;

                      if (Build.VERSION.SDK_INT >= 29) {
                          ContentValues cv = new ContentValues();
                          cv.put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, safeName);
                          cv.put(android.provider.MediaStore.MediaColumns.MIME_TYPE, mime == null ? "application/octet-stream" : mime);
                          cv.put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Parsis");
                          Uri u = ctx.getContentResolver().insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                          if (u == null) { call.reject("insert-failed"); return; }
                          java.io.OutputStream os = ctx.getContentResolver().openOutputStream(u);
                          if (os == null) { call.reject("open-stream-failed"); return; }
                          os.write(bytes);
                          os.flush();
                          os.close();
                          uriOut = u.toString();
                      } else {
                          if (ContextCompat.checkSelfPermission(ctx, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                              call.reject("no-storage-permission");
                              return;
                          }
                          java.io.File dir = new java.io.File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "Parsis");
                          if (!dir.exists()) dir.mkdirs();
                          java.io.File f = new java.io.File(dir, safeName);
                          java.io.FileOutputStream fo = new java.io.FileOutputStream(f);
                          fo.write(bytes);
                          fo.flush();
                          fo.close();
                          try {
                              android.media.MediaScannerConnection.scanFile(ctx, new String[]{f.getAbsolutePath()}, new String[]{mime}, null);
                          } catch (Exception e1) { /* ادامه */ }
                          uriOut = Uri.fromFile(f).toString();
                          legacy = true;
                      }

                      JSObject res = new JSObject();
                      res.put("ok", true);
                      res.put("path", "Download/Parsis/" + safeName);
                      res.put("uri", uriOut);
                      res.put("legacy", legacy);
                      call.resolve(res);
                  } catch (Exception e) {
                      call.reject("save-failed", e.getMessage());
                  }
              }
          }
