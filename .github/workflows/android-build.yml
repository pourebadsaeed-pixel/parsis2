          package ir.parsis.app.widget;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.view.View;
          import android.widget.RemoteViews;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.FileInputStream;

          import ir.parsis.app.MainActivity;
          import ir.parsis.app.R;

          /**
           * ✅ v2.7.3 — ویجت نیتیو «تقویم هفتگی» صفحهٔ اصلی گوشی.
           * داده از فایل calendar-widget.json خوانده می‌شود که لایهٔ وب با
           * ParsisPlugin.pushCalendarWidgetData به‌روزرسانی می‌کند.
           *
           * ساختار ویجت:
           *   • ساعتِ زندهٔ سیستمی (TextClock) — وسطِ بالای ویجت
           *   • تاریخ شمسی + میلادی
           *   • نوار ۷ روزِ هفته (تعطیل‌ها قرمز: جمعه + تعطیلات رسمی)
           *   • فهرست رویدادهای هفته با ListView — قابل اسکرول (درخواست کاربر)
           */
          public class CalendarWidgetProvider extends AppWidgetProvider {

              public static final String DATA_FILE = "calendar-widget.json";

              private static final int[] DAY_CELL_IDS = {
                  R.id.cw_c0, R.id.cw_c1, R.id.cw_c2, R.id.cw_c3, R.id.cw_c4, R.id.cw_c5, R.id.cw_c6
              };
              private static final int[] DAY_NAME_IDS = {
                  R.id.cw_d0, R.id.cw_d1, R.id.cw_d2, R.id.cw_d3, R.id.cw_d4, R.id.cw_d5, R.id.cw_d6
              };
              private static final int[] DAY_NUM_IDS = {
                  R.id.cw_n0, R.id.cw_n1, R.id.cw_n2, R.id.cw_n3, R.id.cw_n4, R.id.cw_n5, R.id.cw_n6
              };
              private static final int[] DAY_GD_IDS = {
                  R.id.cw_g0, R.id.cw_g1, R.id.cw_g2, R.id.cw_g3, R.id.cw_g4, R.id.cw_g5, R.id.cw_g6
              };

              static JSONObject readData(Context ctx) {
                  FileInputStream fis = null;
                  try {
                      fis = ctx.openFileInput(DATA_FILE);
                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096];
                      int n;
                      while ((n = fis.read(buf)) > 0) bos.write(buf, 0, n);
                      return new JSONObject(bos.toString("UTF-8"));
                  } catch (Exception e) {
                      return new JSONObject();
                  } finally {
                      if (fis != null) try { fis.close(); } catch (Exception e2) {}
                  }
              }

              @Override
              public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
                  JSONObject data = readData(ctx);
                  for (int id : ids) {
                      mgr.updateAppWidget(id, buildViews(ctx, data, id));
                  }
              }

              public void push(Context ctx) {
                  AppWidgetManager mgr = AppWidgetManager.getInstance(ctx);
                  int[] ids = mgr.getAppWidgetIds(new ComponentName(ctx, CalendarWidgetProvider.class));
                  if (ids == null || ids.length == 0) return;
                  JSONObject data = readData(ctx);
                  for (int id : ids) {
                      mgr.updateAppWidget(id, buildViews(ctx, data, id));
                  }
              }

              public static void refreshAll(Context ctx) {
                  try { new CalendarWidgetProvider().push(ctx); } catch (Exception e) {}
              }

              private PendingIntent openApp(Context ctx) {
                  Intent it = new Intent(ctx, MainActivity.class);
                  it.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  return PendingIntent.getActivity(ctx, 4321, it,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private RemoteViews buildViews(Context ctx, JSONObject data, int appWidgetId) {
                  RemoteViews rv = new RemoteViews(ctx.getPackageName(), R.layout.widget_cal);
                  rv.setOnClickPendingIntent(R.id.cw_root, openApp(ctx));

                  /* تاریخ شمسی + میلادی */
                  rv.setTextViewText(R.id.cw_jdate, data.optString("jDate", "📅 تقویم هفتگی پارسیس"));
                  rv.setTextViewText(R.id.cw_gdate, data.optString("gDate", ""));

                  /* نوار ۷ روز هفته — تعطیل‌ها قرمز، امروز سبز */
                  JSONArray days = data.optJSONArray("days");
                  int dayCount = (days == null) ? 0 : Math.min(days.length(), 7);
                  for (int i = 0; i < 7; i++) {
                      if (i < dayCount) {
                          JSONObject d = days.optJSONObject(i);
                          if (d == null) { rv.setViewVisibility(DAY_CELL_IDS[i], View.GONE); continue; }
                          boolean hol = d.optBoolean("hol", false);
                          boolean today = d.optBoolean("today", false);
                          rv.setViewVisibility(DAY_CELL_IDS[i], View.VISIBLE);
                          rv.setTextViewText(DAY_NAME_IDS[i], d.optString("n", ""));
                          rv.setTextViewText(DAY_NUM_IDS[i], d.optString("jd", ""));
                          rv.setTextViewText(DAY_GD_IDS[i], d.optString("gd", ""));
                          if (today) {
                              rv.setTextColor(DAY_NAME_IDS[i], 0xFF6EE7B7);
                              rv.setTextColor(DAY_NUM_IDS[i], 0xFFFFFFFF);
                              rv.setTextColor(DAY_GD_IDS[i], 0xFFA7F3D0);
                              rv.setInt(DAY_CELL_IDS[i], "setBackgroundColor", 0x3310B981);
                          } else if (hol) {
                              rv.setTextColor(DAY_NAME_IDS[i], 0xFFFECACA);
                              rv.setTextColor(DAY_NUM_IDS[i], 0xFFFCA5A5);
                              rv.setTextColor(DAY_GD_IDS[i], 0xFFFECACA);
                              rv.setInt(DAY_CELL_IDS[i], "setBackgroundColor", 0x33DC2626);
                          } else {
                              rv.setTextColor(DAY_NAME_IDS[i], 0xFFCBD5E1);
                              rv.setTextColor(DAY_NUM_IDS[i], 0xFFF1F5F9);
                              rv.setTextColor(DAY_GD_IDS[i], 0x99FFFFFF);
                              rv.setInt(DAY_CELL_IDS[i], "setBackgroundColor", 0x14FFFFFF);
                          }
                      } else {
                          rv.setViewVisibility(DAY_CELL_IDS[i], View.GONE);
                      }
                  }

                  /* فهرست رویدادها — ListView قابل اسکرول */
                  Intent svc = new Intent(ctx, CalendarWidgetViewsService.class);
                  svc.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId);
                  svc.setData(Uri.parse(svc.toUri(Intent.URI_INTENT_SCHEME)));
                  rv.setRemoteAdapter(R.id.cw_events, svc);
                  rv.setEmptyView(R.id.cw_events, R.id.cw_empty);
                  Intent open = new Intent(ctx, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  rv.setPendingIntentTemplate(R.id.cw_events, PendingIntent.getActivity(ctx, appWidgetId, open,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));

                  return rv;
              }
          }
