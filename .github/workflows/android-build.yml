          cat > android/app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|navigation|density"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths"></meta-data>
                  </provider>

                  <!-- ================= Receivers ================= -->

                  <!-- دریافت پیامک‌های ورودی اندروید (حتی با اپ بسته) -->
                  <receiver
                      android:name=".SmsReceiver"
                      android:exported="true"
                      android:permission="android.permission.BROADCAST_SMS">
                      <intent-filter android:priority="999">
                          <action android:name="android.provider.Telephony.SMS_RECEIVED" />
                      </intent-filter>
                  </receiver>

                  <!-- ✅ v2.0.6 — سرویس پیش‌زمینه سرور اشتراک‌گذاری شبکه -->
                  <service
                      android:name=".ParsisServerService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <!-- ویجت‌های صفحه اصلی گوشی -->
                  <receiver
                      android:name=".widget.BankWidgetProvider"
                      android:exported="true"
                      android:label="بانک‌ها — پارسیس">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/parsis_bank_widget_info" />
                  </receiver>

                  <receiver
                      android:name=".widget.CashWidgetProvider"
                      android:exported="true"
                      android:label="صندوق‌ها — پارسیس">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/parsis_cash_widget_info" />
                  </receiver>

                  <receiver
                      android:name=".widget.AgendaWidgetProvider"
                      android:exported="true"
                      android:label="یادآورها — پارسیس">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/parsis_agenda_widget_info" />
                  </receiver>

                  <!-- ✅ v2.1.0 — ویجت‌های جدید -->
                  <receiver
                      android:name=".widget.SummaryWidgetProvider"
                      android:exported="true"
                      android:label="خلاصه داشبورد — پارسیس">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/parsis_summary_widget_info" />
                  </receiver>

                  <receiver
                      android:name=".widget.NotesWidgetProvider"
                      android:exported="true"
                      android:label="یادداشت‌ها — پارسیس">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/parsis_notes_widget_info" />
                  </receiver>

                  <receiver
                      android:name=".widget.FacilityWidgetProvider"
                      android:exported="true"
                      android:label="اقساط پیش‌رو — پارسیس">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/parsis_facility_widget_info" />
                  </receiver>

                  <!-- ✅ v2.7.3 — ویجت نیتیو «تقویم هفتگی» (ساعت زنده + روزهای تعطیل قرمز + رویدادهای قابل اسکرول) -->
                  <receiver
                      android:name=".widget.CalendarWidgetProvider"
                      android:exported="true"
                      android:label="تقویم هفتگی — پارسیس">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/parsis_cal_widget_info" />
                  </receiver>

                  <service
                      android:name=".widget.CalendarWidgetViewsService"
                      android:exported="false"
                      android:permission="android.permission.BIND_REMOTEVIEWS" />

                  <!-- ✅ v2.1.0 — تنظیمات ویجت (فونت/رنگ/پس‌زمینه) -->
                  <activity
                      android:name=".widget.WidgetConfigActivity"
                      android:exported="false"
                      android:theme="@android:style/Theme.DeviceDefault.Light.Dialog" />
              </application>
              <!-- Permissions -->

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <!-- ✅ v2.7.3 — تنظیم تقویم هفتگی به‌عنوان پس‌زمینهٔ قفل/صفحه اصلی -->
              <uses-permission android:name="android.permission.SET_WALLPAPER" />

              <!-- پیامک بانکی -->
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <uses-permission android:name="android.permission.READ_SMS" />

              <!-- یادآورها / نوتیفیکیشن -->
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <!-- دوربین (پیوست عکس چک/سند) -->
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="false" />

              <!-- ✅ v2.0.6 — سرور اشتراک‌گذاری شبکه (سرویس پیش‌زمینه) -->
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />

              <!-- ✅ v2.0.6 — دسترسی کامل فایل‌ها (اندروید ۱۱+ — اختیاری، فقط با دکمه تنظیمات) -->
              <uses-permission
                  android:name="android.permission.MANAGE_EXTERNAL_STORAGE"
                  tools:ignore="ScopedStorage" />

              <!-- ✅ v2.7.2 — درخواست کاربر: دسترسی فایل‌ها/دوربین/آلارم -->
              <!-- فایل‌ها: رسانه در اندروید ۱۳+ و حافظهٔ مشترک در ۱۲ و قدیمی‌تر -->
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <!-- آلارم دقیق برای یادآورهای تقویم (اپ تقویم/یادآور — مجاز طبق پالیسی گوگل) -->
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />

              <!-- ✅ v2.0.7 — ذخیرهٔ مستقیم پشتیبان/اکسل در Download فقط برای اندروید ۹ و قدیمی‌تر
                  (اندروید ۱۰+ از MediaStore.Downloads استفاده می‌کند و مجوز نمی‌خواهد) -->
