          package ir.parsis.app.widget;

          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;
          import android.widget.RemoteViewsService;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import ir.parsis.app.R;

          /** ✅ v2.7.3 — فهرست رویدادهای هفته در ویجت تقویم (قابل اسکرول) */
          public class CalendarWidgetViewsService extends RemoteViewsService {
              @Override
              public RemoteViewsFactory onGetViewFactory(Intent intent) {
                  return new CalViewsFactory(getApplicationContext());
              }

              private static class CalViewsFactory implements RemoteViewsFactory {
                  private final Context ctx;
                  private JSONArray events = new JSONArray();

                  CalViewsFactory(Context ctx) { this.ctx = ctx; }

                  @Override public void onCreate() { onDataSetChanged(); }

                  @Override public void onDataSetChanged() {
                      JSONObject data = CalendarWidgetProvider.readData(ctx);
                      JSONArray ev = data.optJSONArray("events");
                      events = (ev == null) ? new JSONArray() : ev;
                  }

                  @Override public void onDestroy() { }

                  @Override public int getCount() { return events.length(); }

                  @Override public RemoteViews getViewAt(int pos) {
                      if (pos < 0 || pos >= events.length()) return null;
                      JSONObject e = events.optJSONObject(pos);
                      if (e == null) return null;
                      boolean hol = e.optBoolean("hol", false);
                      RemoteViews rv = new RemoteViews(ctx.getPackageName(), R.layout.widget_cal_row);
                      rv.setTextViewText(R.id.cwr_date, e.optString("d", ""));
                      String title = e.optString("t", "");
                      String tm = e.optString("tm", "");
                      rv.setTextViewText(R.id.cwr_title, tm.length() > 0 ? title + " — " + tm : title);
                      rv.setTextColor(R.id.cwr_date, hol ? 0xFFFCA5A5 : 0xFF6EE7B7);
                      rv.setTextColor(R.id.cwr_title, hol ? 0xFFFECACA : 0xFFF1F5F9);
                      Intent fill = new Intent();
                      rv.setOnClickFillInIntent(R.id.cwr_row, fill);
                      return rv;
                  }

                  @Override public RemoteViews getLoadingView() { return null; }
                  @Override public int getViewTypeCount() { return 1; }
                  @Override public long getItemId(int pos) { return pos; }
                  @Override public boolean hasStableIds() { return true; }
              }
          }
