#  پارسیس — ساخت خودکار APK اندروید از سورس گیت‌هاب
#  ============================================================
#  ✅ v2.7.1 — این ورک‌فلو حالا «پلاگین کامل نیتیو پارسیس» را داخل APK قرار می‌دهد:
#     • 🖨 چاپ نیتیو (printHtml) — کادر چاپ واقعی اندروید برای گزارش‌ها و اسناد
#     • 💾 ذخیرهٔ مستقیم اکسل/پشتیبان در Download/Parsis (saveFile)
#     • 🔒 قفل بیومتریک (BiometricPrompt نیتیو)
#     • 📡 سرور اشتراک‌گذاری LAN (ParsisServer + سرویس پیش‌زمینه)
#     • 📱 ویجت‌های صفحهٔ اصلی گوشی + پیامک بانکی
#  (در نسخه‌های قبلی فقط پیامک/کلیپ‌بورد تزریق می‌شد و «دکمهٔ چاپ» در اندروید بی‌عملکرد بود)
#
#  اجرا:
#    • دستی: تب Actions ← Build Android APK ← Run workflow
#    • خودکار: پوش کردن تگ مثل v2.7.1
#
#  امضا: چهار Secret در Settings ← Secrets and variables ← Actions
#    KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web assets (www)
        run: |
          mkdir -p www
          cp -r css icons js vendor fonts www/
          cp index.html manifest.json sw.js db.js offline.html native-bridge.js sms.js lan-sync.js icon-192.png icon-512.png www/
          echo "www files: $(find www -type f | wc -l)"

      - name: Install Capacitor 6 + official plugins
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-audit --no-fund --save-exact \
            @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 \
            @capacitor/app@6 @capacitor/haptics@6 @capacitor/share@6 \
            @capacitor/filesystem@6 @capacitor/splash-screen@6 \
            @capacitor/status-bar@6 @capacitor/toast@6 \
            @capacitor/local-notifications@6

      - name: Generate Android project (cap add)
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "ir.parsis.app",
            "appName": "پارسیس",
            "webDir": "www",
            "android": { "allowMixedContent": true }
          }
          JSON
          npx cap add android

      - name: Inject full Parsis native stack (print / save / biometric / server / widgets)
        env:
          APP_CODE: ${{ github.run_number }}
        run: |
          mkdir -p android/app/src/main/java/ir/parsis/app/widget
          cat > android/app/src/main/java/ir/parsis/app/ParsisPlugin.java <<'JAVA'
          package ir.parsis.app;

          import android.Manifest;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.CancellationSignal;
          import android.os.Environment;
          import android.os.ParcelFileDescriptor;
          import android.print.PageRange;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.provider.Settings;
          import android.provider.Telephony;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.annotation.NonNull;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.fragment.app.FragmentActivity;

          import com.getcapacitor.Bridge;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.net.Inet4Address;
          import java.net.InetAddress;
          import java.net.NetworkInterface;

          import fi.iki.elonen.NanoHTTPD;

          import android.app.WallpaperManager;
          import android.appwidget.AppWidgetManager;
          import android.content.ComponentName;

          import ir.parsis.app.widget.ParsisWidgetProvider;
          import ir.parsis.app.widget.CalendarWidgetProvider;

          /**
           * پلاگین اختصاصی پارسیس — پل بین لایه وب و قابلیت‌های نیتیو اندروید:
           *  • دسترسی پیامک (RECEIVE_SMS / READ_SMS) + خواندن اینباکس
           *  • بافر پیامک‌های دریافتی هنگام خاموشی اپ
           *  • ارسال اسنپ‌شات داده به ویجت‌های صفحه اصلی گوشی
           *  • ✅ v2.0.5 — قفل بیومتریک نیتیو (BiometricPrompt)؛ چون WebView اندروید از WebAuthn پشتیبانی نمی‌کند
           *  • ✅ v2.0.7 — چاپ نیتیو گزارش‌ها با PrintManager سیستم + ذخیرهٔ مستقیم فایل‌ها در Download/Parsis
           */
          @CapacitorPlugin(name = "Parsis")
          public class ParsisPlugin extends Plugin {

              private static final int SMS_PERM_REQ = 8151;
              private static final String SNAP_FILE = "widget-snapshot.json";
              private static final String SMS_PREFS = "parsis_sms";
              private static final String SMS_BUFFER = "buffer";

              private boolean hasSms(Context ctx) {
                  return ContextCompat.checkSelfPermission(ctx, Manifest.permission.RECEIVE_SMS) == PackageManager.PERMISSION_GRANTED
                          && ContextCompat.checkSelfPermission(ctx, Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED;
              }

              /* ---------------- پیامک ---------------- */

              @PluginMethod
              public void hasSmsPermission(PluginCall call) {
                  JSObject res = new JSObject();
                  Context ctx = getContext();
                  res.put("granted", ctx != null && hasSms(ctx));
                  call.resolve(res);
              }

              @PluginMethod
              public void requestSmsPermissions(PluginCall call) {
                  Context ctx = getContext();
                  if (ctx == null) { call.reject("no context"); return; }
                  JSObject res = new JSObject();
                  if (hasSms(ctx)) {
                      res.put("granted", true);
                      call.resolve(res);
                      return;
                  }
                  if (getActivity() != null) {
                      ActivityCompat.requestPermissions(
                              getActivity(),
                              new String[]{Manifest.permission.RECEIVE_SMS, Manifest.permission.READ_SMS},
                              SMS_PERM_REQ);
                      res.put("granted", false);
                      res.put("requested", true);
                  } else {
                      res.put("granted", false);
                      res.put("requested", false);
                  }
                  call.resolve(res);
              }

              @PluginMethod
              public void readInboxSms(PluginCall call) {
                  Context ctx = getContext();
                  if (ctx == null || !hasSms(ctx)) { call.reject("permission-not-granted"); return; }

                  int days = call.getInt("days", 30);
                  int limit = call.getInt("limit", 500);
                  if (days < 1) days = 1;
                  if (limit < 1 || limit > 2000) limit = 500;
                  long since = System.currentTimeMillis() - days * 86400000L;

                  JSArray items = new JSArray();
                  Cursor c = null;
                  try {
                      c = ctx.getContentResolver().query(
                              Telephony.Sms.Inbox.CONTENT_URI,
                              new String[]{Telephony.Sms.Inbox.BODY, Telephony.Sms.Inbox.ADDRESS, Telephony.Sms.Inbox.DATE},
                              Telephony.Sms.Inbox.DATE + " >= ?",
                              new String[]{String.valueOf(since)},
                              Telephony.Sms.Inbox.DATE + " DESC");
                      int n = 0;
                      while (c != null && c.moveToNext() && n < limit) {
                          String body = c.getString(0);
                          if (body == null || body.trim().length() == 0) continue;
                          JSObject o = new JSObject();
                          o.put("body", body);
                          o.put("sender", c.getString(1) == null ? "" : c.getString(1));
                          o.put("ts", c.getLong(2));
                          items.put(o);
                          n++;
                      }
                  } catch (Exception e) {
                      /* SecurityException یا خطای دیگر — خروجی خالی */
                  } finally {
                      if (c != null) try { c.close(); } catch (Exception e2) {}
                  }

                  JSObject res = new JSObject();
                  res.put("items", items);
                  call.resolve(res);
              }

              /* ---------------- بافر پیامک هنگام خاموشی ---------------- */

              @PluginMethod
              public void getSmsBuffer(PluginCall call) {
                  Context ctx = getContext();
                  JSArray items = new JSArray();
                  if (ctx != null) {
                      try {
                          SharedPreferences sp = ctx.getSharedPreferences(SMS_PREFS, Context.MODE_PRIVATE);
                          String raw = sp.getString(SMS_BUFFER, "[]");
                          org.json.JSONArray arr = new org.json.JSONArray(raw);
                          for (int i = 0; i < arr.length(); i++) {
                              JSONObject o = arr.optJSONObject(i);
                              if (o != null) {
                                  JSObject io = new JSObject();
                                  io.put("body", o.optString("body", ""));
                                  io.put("sender", o.optString("sender", ""));
                                  io.put("ts", o.optLong("ts", 0L));
                                  items.put(io);
                              }
                          }
                      } catch (Exception e) {
                          /* JSON خراب — خروجی خالی */
                      }
                  }
                  JSObject res = new JSObject();
                  res.put("items", items);
                  call.resolve(res);
              }

              @PluginMethod
              public void clearSmsBuffer(PluginCall call) {
                  Context ctx = getContext();
                  if (ctx != null) {
                      SharedPreferences sp = ctx.getSharedPreferences(SMS_PREFS, Context.MODE_PRIVATE);
                      sp.edit().putString(SMS_BUFFER, "[]").apply();
                  }
                  call.resolve();
              }

              /* ---------------- ویجت‌های صفحه اصلی ---------------- */

              @PluginMethod
              public void pushWidgetData(PluginCall call) {
                  Context ctx = getContext();
                  if (ctx == null) { call.reject("no context"); return; }
                  String json = call.getString("json");
                  if (json == null || json.length() == 0) { call.reject("empty-json"); return; }
                  try {
                      FileOutputStream fos = ctx.openFileOutput(SNAP_FILE, Context.MODE_PRIVATE);
                      fos.write(json.getBytes("UTF-8"));
                      fos.close();
                      ParsisWidgetProvider.refreshAll(ctx);
                      JSObject res = new JSObject();
                      res.put("ok", true);
                      call.resolve(res);
                  } catch (Exception e) {
                      call.reject("write-failed", e.getMessage());
                  }
              }

              /* ---------------- ✅ v2.7.3 — ویجت نیتیو «تقویم هفتگی» + پس‌زمینه ---------------- */

              @PluginMethod
              public void pushCalendarWidgetData(PluginCall call) {
                  Context ctx = getContext();
                  if (ctx == null) { call.reject("no context"); return; }
                  String json = call.getString("json");
                  if (json == null || json.length() == 0) { call.reject("empty-json"); return; }
                  try {
                      FileOutputStream fos = ctx.openFileOutput("calendar-widget.json", Context.MODE_PRIVATE);
                      fos.write(json.getBytes("UTF-8"));
                      fos.close();
                      CalendarWidgetProvider.refreshAll(ctx);
                      JSObject res = new JSObject();
                      res.put("ok", true);
                      call.resolve(res);
                  } catch (Exception e) {
                      call.reject("write-failed", e.getMessage());
                  }
              }

              /* افزودن ویجت تقویم به صفحه اصلی — requestPinAppWidget (اندروید ۸+) */
              @PluginMethod
              public void pinCalendarWidget(PluginCall call) {
                  Context ctx = getContext();
                  JSObject res = new JSObject();
                  if (ctx == null) { res.put("ok", false); call.resolve(res); return; }
                  if (Build.VERSION.SDK_INT < 26) {
                      res.put("ok", false);
                      res.put("reason", "old-android");
                      call.resolve(res);
                      return;
                  }
                  try {
                      AppWidgetManager mgr = AppWidgetManager.getInstance(ctx);
                      ComponentName cn = new ComponentName(ctx, CalendarWidgetProvider.class);
                      boolean ok = mgr.requestPinAppWidget(cn, null, null);
                      res.put("ok", ok);
                      call.resolve(res);
                  } catch (Exception e) {
                      res.put("ok", false);
                      call.resolve(res);
                  }
              }

              /* تنظیم تصویر (base64 PNG) به‌عنوان پس‌زمینهٔ قفل/صفحه اصلی */
              @PluginMethod
              public void setWallpaperFromBase64(PluginCall call) {
                  Context ctx = getContext();
                  JSObject res = new JSObject();
                  if (ctx == null) { res.put("ok", false); call.reject("no context"); return; }
                  String b64 = call.getString("base64");
                  String target = call.getString("target", "lock");
                  if (b64 == null || b64.length() == 0) { res.put("ok", false); call.reject("empty-base64"); return; }
                  if (b64.startsWith("data:") && b64.indexOf(',') >= 0) b64 = b64.substring(b64.indexOf(',') + 1);
                  try {
                      byte[] bytes = android.util.Base64.decode(b64, android.util.Base64.DEFAULT);
                      android.graphics.Bitmap bmp = android.graphics.BitmapFactory.decodeByteArray(bytes, 0, bytes.length);
                      if (bmp == null) { res.put("ok", false); call.reject("decode-failed"); return; }
                      WallpaperManager wm = WallpaperManager.getInstance(ctx);
                      boolean lockOk = false, systemOk = false;
                      boolean wantLock = "lock".equals(target) || "both".equals(target);
                      boolean wantSystem = "system".equals(target) || "both".equals(target);
                      if (Build.VERSION.SDK_INT >= 24) {
                          if (wantLock) {
                              try { wm.setBitmap(bmp, null, true, WallpaperManager.FLAG_LOCK); lockOk = true; } catch (Exception eL) {}
                          }
                          if (wantSystem) {
                              try { wm.setBitmap(bmp, null, true, WallpaperManager.FLAG_SYSTEM); systemOk = true; } catch (Exception eS) {}
                          }
                      } else {
                          try { wm.setBitmap(bmp); systemOk = true; } catch (Exception eO) {}
                      }
                      res.put("ok", lockOk || systemOk);
                      res.put("lockOk", lockOk);
                      res.put("systemOk", systemOk);
                      call.resolve(res);
                  } catch (Exception e) {
                      res.put("ok", false);
                      call.reject("wallpaper-failed", e.getMessage());
                  }
              }

              /* ---------------- قفل بیومتریک نیتیو (✅ v2.0.5) ----------------
                 WebView اندروید استاندارد WebAuthn را پیاده‌سازی نمی‌کند؛ برای همین
                 قفل بیومتریک در نسخه اندروید از طریق BiometricPrompt سیستم‌عامل کار می‌کند.
                 اثر انگشت، چهره یا قفل صفحه گوشی — هر کدام که ثبت شده باشد. */

              @PluginMethod
              public void isBiometricAvailable(PluginCall call) {
                  Context ctx = getContext();
                  JSObject res = new JSObject();
                  if (ctx == null) {
                      res.put("available", false);
                      res.put("status", "no-context");
                      call.resolve(res);
                      return;
                  }
                  try {
                      BiometricManager bm = BiometricManager.from(ctx);
                      int auths = BiometricManager.Authenticators.BIOMETRIC_WEAK
                              | BiometricManager.Authenticators.DEVICE_CREDENTIAL;
                      int can = bm.canAuthenticate(auths);
                      res.put("available", can == BiometricManager.BIOMETRIC_SUCCESS);
                      res.put("status", String.valueOf(can));
                  } catch (Exception e) {
                      res.put("available", false);
                      res.put("status", "error");
                  }
                  call.resolve(res);
              }

              @PluginMethod
              public void authenticate(PluginCall call) {
                  android.app.Activity act = (getActivity() != null) ? getActivity() : bridge.getActivity();
                  if (!(act instanceof FragmentActivity)) {
                      call.reject("no-fragment-activity");
                      return;
                  }
                  final FragmentActivity activity = (FragmentActivity) act;
                  final String title = call.getString("title", "ورود به پارسیس");
                  final String subtitle = call.getString("subtitle", "");
                  final boolean deviceCredential = call.getBoolean("deviceCredential", true);
                  final PluginCall pending = call;

                  final BiometricPrompt.PromptInfo.Builder b = new BiometricPrompt.PromptInfo.Builder()
                          .setTitle(title)
                          .setSubtitle(subtitle);
                  if (deviceCredential) {
                      /* اثر انگشت/چهره یا قفل صفحه — متن منفی در این حالت توسط سیستم نمایش داده می‌شود */
                      b.setAllowedAuthenticators(
                              BiometricManager.Authenticators.BIOMETRIC_WEAK
                              | BiometricManager.Authenticators.DEVICE_CREDENTIAL);
                  } else {
                      b.setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_WEAK)
                              .setNegativeButtonText("انصراف");
                  }

                  activity.runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              BiometricPrompt prompt = new BiometricPrompt(
                                      activity,
                                      ContextCompat.getMainExecutor(activity),
                                      new BiometricPrompt.AuthenticationCallback() {
                                          @Override
                                          public void onAuthenticationSucceeded(@NonNull BiometricPrompt.AuthenticationResult result) {
                                              JSObject res = new JSObject();
                                              res.put("success", true);
                                              pending.resolve(res);
                                          }

                                          @Override
                                          public void onAuthenticationError(int errorCode, @NonNull CharSequence errString) {
                                              JSObject res = new JSObject();
                                              res.put("success", false);
                                              res.put("code", errorCode);
                                              res.put("message", errString == null ? "" : errString.toString());
                                              pending.resolve(res);
                                          }
                                      });
                              prompt.authenticate(b.build());
                          } catch (Exception e) {
                              JSObject res = new JSObject();
                              res.put("success", false);
                              res.put("code", -1);
                              res.put("message", e.getMessage() == null ? "prompt-failed" : e.getMessage());
                              pending.resolve(res);
                          }
                      }
                  });
              }

              /* ---------------- سرور شبکه محلی (✅ v2.0.6) ----------------
                 گوشی صاحب داده = سرور؛ مرورگر دیگران با لینک + کد ۴ رقمی وصل می‌شوند.
                 داده از وب به‌صورت زنده با pushServerData می‌آید و تغییرهای مرورگر
                 دیگر با رویداد parsisRemoteChange به وب برمی‌گردد. */

              private static ParsisServer lanServer = null;
              public static volatile int lanPort = -1;
              public static volatile String lanIp = "";

              private JSObject lanErr(String msg) {
                  JSObject res = new JSObject();
                  res.put("ok", false);
                  res.put("error", msg);
                  return res;
              }

              @PluginMethod
              public void serverStart(PluginCall call) {
                  Context ctx = getContext();
                  if (ctx == null) { call.resolve(lanErr("no-context")); return; }

                  String pin = call.getString("pin", "");
                  if (pin == null || pin.trim().length() == 0) pin = "0000";
                  final String fPin = pin.trim();

                  if (lanServer != null && lanServer.wasStarted()) {
                      JSObject res = new JSObject();
                      res.put("ok", true);
                      res.put("port", lanPort);
                      res.put("ip", lanIp);
                      res.put("rev", ParsisServer.getRev());
                      call.resolve(res);
                      return;
                  }

                  ParsisServer.setChangeListener(new ParsisServer.ChangeListener() {
                      @Override
                      public void onRemoteChange(String store, Object data) {
                          try {
                              final Bridge br = MainActivity.staticBridge;
                              if (br == null) return;
                              final String payload;
                              try {
                                  JSONObject p = new JSONObject();
                                  p.put("store", store);
                                  p.put("data", data == null ? JSONObject.NULL : data);
                                  payload = p.toString();
                              } catch (Exception je) { return; }
                              android.app.Activity act = br.getActivity();
                              if (act == null) return;
                              act.runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      try { br.triggerJSEvent("parsisRemoteChange", "window", payload); } catch (Exception e2) { /* ادامه */ }
                                  }
                              });
                          } catch (Exception e) { /* ادامه */ }
                      }
                  });

                  Exception lastErr = null;
                  for (int port = 8080; port <= 8090; port++) {
                      try {
                          ParsisServer s = new ParsisServer(ctx.getAssets(), port, fPin);
                          s.start(NanoHTTPD.SOCKET_READ_TIMEOUT, true);
                          lanServer = s;
                          lanPort = port;
                          lanIp = getLocalIp();

                          try {
                              Intent si = new Intent(ctx, ParsisServerService.class);
                              if (Build.VERSION.SDK_INT >= 26) ctx.startForegroundService(si);
                              else ctx.startService(si);
                          } catch (Exception se) { /* نوتیفیکیشن اجباری نشد — ادامه */ }

                          JSObject res = new JSObject();
                          res.put("ok", true);
                          res.put("port", port);
                          res.put("ip", lanIp);
                          res.put("rev", ParsisServer.getRev());
                          call.resolve(res);
                          return;
                      } catch (Exception e) {
                          lastErr = e;
                      }
                  }
                  lanServer = null;
                  lanPort = -1;
                  JSObject res = lanErr(lastErr == null || lastErr.getMessage() == null ? "port-busy" : String.valueOf(lastErr.getMessage()));
                  call.resolve(res);
              }

              @PluginMethod
              public void serverStop(PluginCall call) {
                  try {
                      if (lanServer != null) lanServer.stop();
                  } catch (Exception e) { /* ادامه */ }
                  lanServer = null;
                  lanPort = -1;
                  try {
                      Context ctx = getContext();
                      if (ctx != null) ctx.stopService(new Intent(ctx, ParsisServerService.class));
                  } catch (Exception e2) { /* ادامه */ }
                  JSObject res = new JSObject();
                  res.put("ok", true);
                  call.resolve(res);
              }

              @PluginMethod
              public void serverStatus(PluginCall call) {
                  JSObject res = new JSObject();
                  boolean running = false;
                  try { running = lanServer != null && lanServer.wasStarted(); } catch (Exception e) { running = false; }
                  res.put("running", running);
                  res.put("port", lanPort);
                  res.put("ip", lanIp);
                  res.put("rev", ParsisServer.getRev());
                  call.resolve(res);
              }

              @PluginMethod
              public void serverState(PluginCall call) {
                  JSObject res = new JSObject();
                  try {
                      JSONObject snap = new JSONObject(ParsisServer.getSnapshotJson());
                      res.put("rev", snap.optLong("rev", 0L));
                      res.put("stores", snap.optJSONObject("stores"));
                  } catch (Exception e) {
                      res.put("rev", 0L);
                      res.put("stores", new JSObject());
                  }
                  call.resolve(res);
              }

              @PluginMethod
              public void pushServerData(PluginCall call) {
                  String json = call.getString("json");
                  if (json == null || json.length() == 0) { call.reject("empty-json"); return; }
                  ParsisServer.mergeStores(json);
                  JSObject res = new JSObject();
                  res.put("ok", true);
                  res.put("rev", ParsisServer.getRev());
                  call.resolve(res);
              }

              @PluginMethod
              public void serverSetPin(PluginCall call) {
                  String pin = call.getString("pin", "");
                  if (pin != null && pin.trim().length() > 0) ParsisServer.setPin(pin.trim());
                  JSObject res = new JSObject();
                  res.put("ok", true);
                  call.resolve(res);
              }

              private String getLocalIp() {
                  try {
                      java.util.Enumeration<NetworkInterface> nis = NetworkInterface.getNetworkInterfaces();
                      String fallback = "";
                      while (nis.hasMoreElements()) {
                          NetworkInterface ni = nis.nextElement();
                          if (!ni.isUp() || ni.isLoopback()) continue;
                          java.util.Enumeration<InetAddress> addrs = ni.getInetAddresses();
                          while (addrs.hasMoreElements()) {
                              InetAddress a = addrs.nextElement();
                              if (a.isLoopbackAddress() || !(a instanceof Inet4Address)) continue;
                              String h = a.getHostAddress();
                              if (h == null || h.length() == 0) continue;
                              if (h.startsWith("192.168.")) return h;
                              if ((h.startsWith("10.") || h.startsWith("172.")) && fallback.length() == 0) fallback = h;
                          }
                      }
                      return fallback.length() == 0 ? "?" : fallback;
                  } catch (Exception e) {
                      return "?";
                  }
              }

