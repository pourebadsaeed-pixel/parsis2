          cat > android/app/src/main/java/ir/parsis/app/widget/WidgetConfigActivity.java <<'JAVA'
          package ir.parsis.app.widget;

          import android.appwidget.AppWidgetManager;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.AdapterView;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.CompoundButton;
          import android.widget.RadioGroup;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;

          import ir.parsis.app.R;

          /**
           * ✅ v2.1.0 — تنظیمات ویجت صفحه اصلی پارسیس.
           *
           * سه راه باز شدن:
           *   ۱) آیکن ⚙ داخل خود ویجت (همیشه کار می‌کند)
           *   ۲) دکمه Edit لانچرهای اندروید ۱۲+ (widgetFeatures=reconfigurable)
           *   ۳) هنگام افزودن ویجت به صفحه اصلی (android:configure)
           *
           * تنظیمات: اندازه فونت، رنگ متن، رنگ مقادیر، رنگ پس‌زمینه، نمایش عنوان.
           */
          public class WidgetConfigActivity extends Activity {

              private int appWidgetId = AppWidgetManager.INVALID_APPWIDGET_ID;

              /* گزینه‌های رنگ: [نام فارسی، آرگب] */
              private static final Object[][] TEXT_COLORS = {
                      {"روشن (پیش‌فرض)", 0xFFF1F5F9},
                      {"کهربایی", 0xFFFBBF24},
                      {"سبز روشن", 0xFF86EFAC},
                      {"آبی روشن", 0xFF93C5FD},
                      {"صورتی", 0xFFF9A8D4},
                      {"سفید خالص", 0xFFFFFFFF},
                      {"تیره (برای پس‌زمینه روشن)", 0xFF0F172A}
              };
              private static final Object[][] BG_COLORS = {
                      {"پیش‌فرض تم ویجت", 0},
                      {"سرمه‌ای نیمه‌شفاف", 0xCC0F172A},
                      {"آبی تیره", 0xEE1E3A8A},
                      {"سبز تیره", 0xEE064E3B},
                      {"خاکستری تیره", 0xEE1F2937},
                      {"شفاف کامل", 0x00000000},
                      {"سفید مات", 0xFFFFFFFF},
                      {"کرم روشن", 0xFFFFF7ED}
              };

              private Spinner spText, spVal, spBg;
              private CheckBox cbTitle;
              private RadioGroup rgScale;
              private JSONObject original;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setResult(RESULT_CANCELED);
                  appWidgetId = getIntent().getIntExtra(AppWidgetManager.EXTRA_APPWIDGET_ID,
                          AppWidgetManager.INVALID_APPWIDGET_ID);
                  if (appWidgetId == AppWidgetManager.INVALID_APPWIDGET_ID) {
                      finish();
                      return;
                  }

                  setContentView(R.layout.activity_widget_config);

                  TextView title = findViewById(R.id.wcfg_title);
                  String providerClass = getIntent().getStringExtra("providerClass");
                  if (providerClass != null && providerClass.contains("Bank")) title.setText("⚙ تنظیمات ویجت بانک‌ها");
                  else if (providerClass != null && providerClass.contains("Cash")) title.setText("⚙ تنظیمات ویجت صندوق‌ها");
                  else if (providerClass != null && providerClass.contains("Agenda")) title.setText("⚙ تنظیمات ویجت یادآورها");
                  else if (providerClass != null && providerClass.contains("Summary")) title.setText("⚙ تنظیمات ویجت خلاصه");
                  else if (providerClass != null && providerClass.contains("Notes")) title.setText("⚙ تنظیمات ویجت یادداشت‌ها");
                  else if (providerClass != null && providerClass.contains("Facility")) title.setText("⚙ تنظیمات ویجت اقساط");
                  else title.setText("⚙ تنظیمات ویجت پارسیس");

                  original = ParsisWidgetProvider.readCfg(this, appWidgetId);

                  /* اندازه فونت */
                  rgScale = findViewById(R.id.wcfg_scale);
                  double scale = original.optDouble("scale", 1.0);
                  if (scale < 0.92) rgScale.check(R.id.wcfg_scale_small);
                  else if (scale > 1.08) rgScale.check(R.id.wcfg_scale_large);
                  else rgScale.check(R.id.wcfg_scale_normal);

                  /* نمایش عنوان */
                  cbTitle = findViewById(R.id.wcfg_show_title);
                  cbTitle.setChecked(original.optBoolean("showTitle", true));

                  /* رنگ‌ها */
                  spText = findViewById(R.id.wcfg_text_color);
                  spVal = findViewById(R.id.wcfg_val_color);
                  spBg = findViewById(R.id.wcfg_bg_color);
                  setupColorSpinner(spText, TEXT_COLORS, original.optInt("textColor", 0xFFF1F5F9));
                  setupColorSpinner(spVal, TEXT_COLORS, original.optInt("valColor", 0xFFFBBF24));
                  setupColorSpinner(spBg, BG_COLORS, original.optInt("bgColor", 0));

                  /* ذخیره */
                  Button save = findViewById(R.id.wcfg_save);
                  save.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          try {
                              JSONObject cfg = new JSONObject();
                              double sc = 1.0;
                              int rid = rgScale.getCheckedRadioButtonId();
                              if (rid == R.id.wcfg_scale_small) sc = 0.85;
                              else if (rid == R.id.wcfg_scale_large) sc = 1.25;
                              cfg.put("scale", sc);
                              cfg.put("showTitle", cbTitle.isChecked());
                              cfg.put("textColor", (int) colorOf(spText, TEXT_COLORS));
                              cfg.put("valColor", (int) colorOf(spVal, TEXT_COLORS));
                              cfg.put("bgColor", (int) colorOf(spBg, BG_COLORS));
                              ParsisWidgetProvider.writeCfg(WidgetConfigActivity.this, appWidgetId, cfg);
                          } catch (Exception e) {
                              Toast.makeText(WidgetConfigActivity.this, "خطا در ذخیره تنظیمات", Toast.LENGTH_SHORT).show();
                          }
                          ParsisWidgetProvider.refreshAll(WidgetConfigActivity.this);

                          Intent result = new Intent();
                          result.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId);
                          setResult(RESULT_OK, result);
                          Toast.makeText(WidgetConfigActivity.this, "✅ تنظیمات ویجت ذخیره شد", Toast.LENGTH_SHORT).show();
                          finish();
                      }
                  });

                  /* انصراف */
                  Button cancel = findViewById(R.id.wcfg_cancel);
                  cancel.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          Intent result = new Intent();
                          result.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId);
                          setResult(RESULT_OK, result); /* ویجت با تنظیمات فعلی باقی می‌ماند */
                          finish();
                      }
                  });
              }

              private void setupColorSpinner(Spinner sp, Object[][] items, int current) {
                  List<String> names = new ArrayList<>();
                  int selIdx = 0;
                  for (int i = 0; i < items.length; i++) {
                      names.add((String) items[i][0]);
                      int c = (int) items[i][1];
                      if (c == current) selIdx = i;
                  }
                  ArrayAdapter<String> ad = new ArrayAdapter<>(this, android.R.layout.simple_spinner_item, names);
                  ad.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);
                  sp.setAdapter(ad);
                  sp.setSelection(selIdx);
              }

              private long colorOf(Spinner sp, Object[][] items) {
                  int idx = sp.getSelectedItemPosition();
                  if (idx < 0 || idx >= items.length) return 0;
                  return ((Number) items[idx][1]).longValue();
              }

              @Override
              public void onBackPressed() {
                  /* مثل انصراف: ویجت باقی می‌ماند */
                  Intent result = new Intent();
                  result.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId);
                  setResult(RESULT_OK, result);
                  finish();
              }
          }
