          python3 - <<'PY'
          import os, re
          bg = 'android/app/build.gradle'
          g = open(bg, encoding='utf-8').read()
          if 'androidx.biometric:biometric' not in g:
              g = g.replace("implementation project(':capacitor-android')",
                            "implementation 'androidx.biometric:biometric:1.1.0'\n    implementation 'org.nanohttpd:nanohttpd:2.3.1'\n    implementation project(':capacitor-android')")
          open(bg, 'w', encoding='utf-8').write(g)
          print('gradle deps patched')

          mp = 'android/app/src/main/AndroidManifest.xml'
          s = open(mp, encoding='utf-8').read()
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s = s.replace('<uses-permission android:name="android.permission.INTERNET" />',
                            '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />')
              open(mp, 'w', encoding='utf-8').write(s)
