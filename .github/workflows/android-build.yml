          package ir.parsis.app;

          import android.content.res.AssetManager;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;

          import fi.iki.elonen.NanoHTTPD;

          /**
           * سرور شبکه محلی پارسیس (✅ v2.0.6) — NanoHTTPD
           *
           * وظایف:
           *  ۱) سرو کردن کل اپ وب (پوشه assets/public) روی وای‌فای محلی
           *  ۲) API همگام‌سازی داده (/parsis-api/...) با کد دسترسی ۴ رقمی:
           *     GET  /parsis-api/rev                  → شماره نسخه داده
           *     GET  /parsis-api/snapshot?key=XXXX    → کل داده (فقط با کد درست)
           *     POST /parsis-api/changes              → نوشتن تغییر از مرورگر دیگر
           *
           * امنیت: بدون کد دسترسی درست هیچ داده‌ای بیرون داده نمی‌شود.
           */
          public class ParsisServer extends NanoHTTPD {

              public interface ChangeListener {
                  void onRemoteChange(String store, Object data);
              }

              private final AssetManager assets;

              /* داده مشترک — static تا بین ساخت‌های مجدد سرور حفظ شود */
              private static final Object LOCK = new Object();
              private static final JSONObject STATE = new JSONObject();
              private static volatile long REV = 0;
              private static volatile String PIN = "";
              private static volatile ChangeListener changeListener = null;

              public static void setPin(String pin) {
                  if (pin != null) PIN = pin;
              }

              public static void setChangeListener(ChangeListener l) {
                  changeListener = l;
              }

              public static long getRev() {
                  return REV;
              }

              public static String getSnapshotJson() {
                  synchronized (LOCK) {
                      try {
                          JSONObject out = new JSONObject();
                          out.put("rev", REV);
                          out.put("stores", new JSONObject(STATE.toString()));
                          return out.toString();
                      } catch (Exception e) {
                          return "{\"rev\":" + REV + ",\"stores\":{}}";
                      }
                  }
              }

              public static void mergeStores(String json) {
                  try {
                      JSONObject in = new JSONObject(json);
                      synchronized (LOCK) {
                          java.util.Iterator<String> it = in.keys();
                          while (it.hasNext()) {
                              String k = it.next();
                              STATE.put(k, in.get(k));
                          }
                          REV++;
                      }
                  } catch (Exception e) {
                      /* JSON خراب — نادیده */
                  }
              }

              public ParsisServer(AssetManager assets, int port, String pin) {
                  super(port);
                  this.assets = assets;
                  setPin(pin);
              }

              @Override
              public Response serve(IHTTPSession session) {
                  try {
                      String uri = session.getUri() == null ? "/" : session.getUri();
                      Method method = session.getMethod();

                      /* ---------- API سینک ---------- */
                      if (uri.startsWith("/parsis-api/")) {
                          return serveApi(session, uri, method);
                      }

                      /* ---------- سرو فایل‌های استاتیک اپ ---------- */
                      if (method != Method.GET && method != Method.HEAD) {
                          return json(405, "{\"error\":\"method-not-allowed\"}");
                      }
                      return serveStatic(uri);
                  } catch (Exception e) {
                      return json(500, "{\"error\":\"internal\"}");
                  }
              }

              private Response serveApi(IHTTPSession session, String uri, Method method) {
                  String key = firstParam(session);

                  if (uri.equals("/parsis-api/rev")) {
                      return json(200, "{\"rev\":" + REV + "}");
                  }

                  if (uri.equals("/parsis-api/snapshot")) {
                      if (!PIN.equals(key)) return json(401, "{\"error\":\"bad-key\"}");
                      return json(200, getSnapshotJson());
                  }

                  if (uri.equals("/parsis-api/changes")) {
                      if (!PIN.equals(key)) return json(401, "{\"error\":\"bad-key\"}");
                      if (method != Method.POST) return json(405, "{\"error\":\"method-not-allowed\"}");
                      try {
                          java.util.Map<String, String> body = new java.util.HashMap<>();
                          session.parseBody(body);
                          String raw = body.get("postData");
                          if (raw == null || raw.trim().length() == 0) return json(400, "{\"error\":\"empty-body\"}");

                          JSONObject in = new JSONObject(raw);
                          if (!PIN.equals(in.optString("key", ""))) return json(401, "{\"error\":\"bad-key\"}");

                          JSONArray arr = in.optJSONArray("stores");
                          if (arr != null) {
                              synchronized (LOCK) {
                                  for (int i = 0; i < arr.length(); i++) {
                                      JSONObject item = arr.optJSONObject(i);
                                      if (item == null) continue;
                                      String store = item.optString("store", "");
                                      if (store.length() == 0) continue;
                                      Object data = item.opt("data");
                                      STATE.put(store, data);
                                  }
                                  REV++;
                              }
                              /* اطلاع به اپ صاحب گوشی (رویداد به WebView) */
                              notifyChange(arr);
                          }
                          return json(200, "{\"ok\":true,\"rev\":" + REV + "}");
                      } catch (Exception e) {
                          return json(400, "{\"error\":\"bad-request\"}");
                      }
                  }

                  return json(404, "{\"error\":\"not-found\"}");
              }

              private void notifyChange(JSONArray arr) {
                  ChangeListener l = changeListener;
                  if (l == null || arr == null) return;
                  try {
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject item = arr.optJSONObject(i);
                          if (item == null) continue;
                          String store = item.optString("store", "");
                          if (store.length() == 0) continue;
                          try { l.onRemoteChange(store, item.opt("data")); } catch (Exception e2) { /* ادامه */ }
                      }
                  } catch (Exception e) { /* ادامه */ }
              }

              private String firstParam(IHTTPSession session) {
                  try {
                      java.util.List<String> vals = session.getParameters().get("key");
                      if (vals != null && !vals.isEmpty()) return vals.get(0);
                  } catch (Exception e) { /* ادامه */ }
                  try {
                      String h = session.getHeaders().get("x-parsis-key");
                      if (h != null) return h;
                  } catch (Exception e) { /* ادامه */ }
                  return "";
              }

              private Response serveStatic(String uri) {
                  String path = uri;
                  if (path.equals("/") || path.length() == 0) path = "/index.html";
                  /* جلوگیری از مسیردهی خارج از assets */
                  if (path.contains("..")) return json(403, "{\"error\":\"forbidden\"}");

                  byte[] data = readAsset("public" + path);
                  if (data == null) {
                      /* مسیرهای ناشناخته → index.html (اپ با روتر هش کار می‌کند) */
                      data = readAsset("public/index.html");
                      if (data == null) return json(404, "{\"error\":\"not-found\"}");
                      path = "/index.html";
                  }
                  String mime = guessMime(path);
                  Response r = newFixedLengthResponse(Response.Status.OK, mime,
                          new ByteArrayInputStream(data), data.length);
                  r.addHeader("Cache-Control", "no-cache");
                  return r;
              }

              private byte[] readAsset(String path) {
                  InputStream is = null;
                  try {
                      is = assets.open(path);
                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = is.read(buf)) > 0) bos.write(buf, 0, n);
                      return bos.toByteArray();
                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (is != null) try { is.close(); } catch (Exception e2) { /* ادامه */ }
                  }
              }

              private String guessMime(String path) {
                  String p = path.toLowerCase();
                  if (p.endsWith(".html") || p.endsWith(".htm")) return "text/html; charset=utf-8";
                  if (p.endsWith(".js")) return "application/javascript; charset=utf-8";
                  if (p.endsWith(".css")) return "text/css; charset=utf-8";
                  if (p.endsWith(".json") || p.endsWith(".webmanifest")) return "application/json; charset=utf-8";
                  if (p.endsWith(".png")) return "image/png";
                  if (p.endsWith(".jpg") || p.endsWith(".jpeg")) return "image/jpeg";
                  if (p.endsWith(".gif")) return "image/gif";
                  if (p.endsWith(".svg")) return "image/svg+xml";
                  if (p.endsWith(".ico")) return "image/x-icon";
                  if (p.endsWith(".woff")) return "font/woff";
                  if (p.endsWith(".woff2")) return "font/woff2";
                  if (p.endsWith(".ttf")) return "font/ttf";
                  if (p.endsWith(".txt") || p.endsWith(".md")) return "text/plain; charset=utf-8";
                  return "application/octet-stream";
              }

              private Response json(int status, String body) {
                  Response r = newFixedLengthResponse(
                          status == 200 ? Response.Status.OK
                          : status == 401 ? Response.Status.UNAUTHORIZED
                          : status == 403 ? Response.Status.FORBIDDEN
                          : status == 404 ? Response.Status.NOT_FOUND
                          : status == 405 ? Response.Status.METHOD_NOT_ALLOWED
                          : status == 400 ? Response.Status.BAD_REQUEST
                          : Response.Status.INTERNAL_ERROR,
                          "application/json; charset=utf-8",
                          body);
                  r.addHeader("Cache-Control", "no-store");
                  return r;
              }
          }
