<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تست فاز ۴</title>
</head>
<body>
<h1>تست فاز ۴ (اسناد)</h1>
<div id="result"></div>

<header class="topbar"><h1>تاپ‌بار</h1></header>
<div class="sidebar-search"><input placeholder="جستجو"></div>

<div id="voucher-head-card">
    <input type="hidden" id="v-id">
    <input type="hidden" id="v-number">
    <input type="text" id="v-date" class="date-picker" dir="ltr">
    <select id="v-type"><option value="general">عمومی</option></select>
    <input type="text" id="v-desc">
</div>
<div id="voucher-lines"></div>
<div id="v-total-debit">0</div>
<div id="v-total-credit">0</div>
<div id="v-balance-status"></div>

<datalist id="std-desc-list"></datalist>

<script src="./js/core/db.js"></script>
<script src="./js/core/constants.js"></script>
<script src="./js/core/utils.js"></script>
<script src="./js/core/state.js"></script>
<script src="./js/core/router.js"></script>
<script src="./js/core/calendar-popup.js"></script>
<script src="./js/core/hide.js"></script>
<script src="./js/core/lookups.js"></script>
<script src="./js/ui/toast.js"></script>
<script src="./js/ui/nav.js"></script>
<script src="./js/ui/theme.js"></script>
<script src="./js/ui/table.js"></script>
<script src="./js/ui/form.js"></script>
<script src="./js/ui/share.js"></script>
<script src="./js/ui/observers.js"></script>
<script src="./js/modules/accounts/fiscal.js"></script>
<script src="./js/modules/accounts/chart.js"></script>
<script src="./js/modules/persons.js"></script>
<script src="./js/modules/accounts/companies.js"></script>
<script src="./js/modules/accounts/banks.js"></script>
<script src="./js/modules/accounts/cashboxes.js"></script>
<script src="./js/modules/accounts/projects.js"></script>
<script src="./js/modules/accounts/templates.js"></script>
<script src="./js/modules/vouchers/form.js"></script>

<script>
var out = [];
function log(label, ok, extra) {
    out.push((ok ? '✅' : '❌') + ' ' + label + (extra ? ' → ' + extra : ''));
}
try {
    log('voucherLines',                  typeof voucherLines !== 'undefined');
    log('renderVoucherLines',            typeof renderVoucherLines === 'function');
    log('newVoucherForm',                typeof newVoucherForm === 'function');
    log('persistVoucher',                typeof persistVoucher === 'function');
    log('loadVoucherForEdit',            typeof loadVoucherForEdit === 'function');
    log('applyTemplate',                 typeof applyTemplate === 'function');
    log('saveVoucherAsTemplate',         typeof saveVoucherAsTemplate === 'function');
    log('bindVoucherForm',               typeof bindVoucherForm === 'function');
    log('getNextVoucherNumberForPeriod', typeof getNextVoucherNumberForPeriod === 'function');
    log('validateDateInActivePeriod',    typeof validateDateInActivePeriod === 'function');
    log('getVoucherIssues',              typeof getVoucherIssues === 'function');
    log('getVoucherAmount',              typeof getVoucherAmount === 'function');

    setTimeout(function () {
        try {
            bindVoucherForm();
            newVoucherForm();
            log('اجرای newVoucherForm', true, voucherLines.length + ' ردیف');
            log('نوار وضعیت ساخته شد', !!document.getElementById('voucher-status-bar'));
        } catch (e) {
            log('اجرای newVoucherForm', false, e.message);
        }
        document.getElementById('result').innerHTML = out.join('<br>');
    }, 500);
} catch (e) {
    document.getElementById('result').innerHTML = out.join('<br>') + '<br>❌ ' + e.message;
}
</script>
</body>
</html>
