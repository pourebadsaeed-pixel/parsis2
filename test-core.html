<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<h1>تست فاز ۳ (اطلاعات پایه)</h1>
<div id="result"></div>

<header class="topbar"><h1>تاپ‌بار</h1></header>
<div class="sidebar-search"><input placeholder="جستجو"></div>

<script src="./js/core/db.js"></script>
<script src="./js/core/constants.js"></script>
<script src="./js/core/utils.js"></script>
<script src="./js/core/state.js"></script>
<script src="./js/core/router.js"></script>
<script src="./js/core/calendar-popup.js"></script>
<script src="./js/core/hide.js"></script>
<script src="./js/core/lookups.js"></script>
<script src="./js/ui/toast.js"></script>
<script src="./js/ui/nav.js"></script>
<script src="./js/ui/theme.js"></script>
<script src="./js/ui/table.js"></script>
<script src="./js/ui/form.js"></script>
<script src="./js/ui/share.js"></script>
<script src="./js/ui/observers.js"></script>
<script src="./js/modules/accounts/fiscal.js"></script>
<script src="./js/modules/accounts/chart.js"></script>
<script src="./js/modules/persons.js"></script>
<script src="./js/modules/accounts/companies.js"></script>
<script src="./js/modules/accounts/banks.js"></script>
<script src="./js/modules/accounts/cashboxes.js"></script>
<script src="./js/modules/accounts/projects.js"></script>
<script src="./js/modules/accounts/templates.js"></script>

<script>
var out = [];
function log(label, ok, extra) {
    out.push((ok ? '✅' : '❌') + ' ' + label + (extra ? ' → ' + extra : ''));
}
try {
    /* fiscal */
    log('renderFiscalList',         typeof renderFiscalList === 'function');
    log('attachRowActions',         typeof attachRowActions === 'function');

    /* chart */
    log('renderChartTree',          typeof renderChartTree === 'function');
    log('loadDefaultChart',         typeof loadDefaultChart === 'function');

    /* persons */
    log('renderPersonsList',        typeof renderPersonsList === 'function');
    log('bindPersonsForm',          typeof bindPersonsForm === 'function');

    /* companies */
    log('renderCompaniesList',      typeof renderCompaniesList === 'function');

    /* banks */
    log('renderBankAccountsList',   typeof renderBankAccountsList === 'function');
    log('refreshBankTypeSelect',    typeof refreshBankTypeSelect === 'function');

    /* cashboxes */
    log('renderCashBoxesList',      typeof renderCashBoxesList === 'function');

    /* projects */
    log('renderProjectsList',       typeof renderProjectsList === 'function');

    /* templates */
    log('getDefaultTemplates',      typeof getDefaultTemplates === 'function');
    log('renderTemplateList',       typeof renderTemplateList === 'function');
    log('renderStdDescChips',       typeof renderStdDescChips === 'function');
    log('refreshTemplateSelect',    typeof refreshTemplateSelect === 'function');

    /* تست عملی */
    var dt = getDefaultTemplates();
    log('تعداد الگوهای پیش‌فرض', dt.length === 5, dt.length);

    var ds = getDefaultStdDescriptions();
    log('تعداد شرح‌های پیش‌فرض', ds.length > 0, ds.length);

    document.getElementById('result').innerHTML = out.join('<br>');
} catch (e) {
    document.getElementById('result').innerHTML = out.join('<br>') + '<br>❌ ' + e.message;
}
</script>
</body>
</html>
