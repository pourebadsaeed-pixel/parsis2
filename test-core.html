<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تست کامل Core + UI</title>
</head>
<body>

<h1>تست کامل Core + UI</h1>
<div id="result"></div>

<header class="topbar"><h1>تاپ‌بار</h1></header>
<div class="sidebar-search"><input placeholder="جستجو"></div>

<div class="list-header" data-col-table="test-table" data-hide-key="test">
    <span>نمونه</span>
</div>
<table class="data-table" id="test-table">
    <thead>
        <tr>
            <th data-sortable data-sort-key="name" data-orig-index="0">نام <span class="sort-ind"></span></th>
            <th data-sortable data-sort-key="age" data-orig-index="1">سن <span class="sort-ind"></span></th>
        </tr>
    </thead>
    <tbody>
        <tr><td>علی</td><td>30</td></tr>
        <tr><td>رضا</td><td>25</td></tr>
    </tbody>
</table>

<script src="./js/core/db.js"></script>
<script src="./js/core/constants.js"></script>
<script src="./js/core/utils.js"></script>
<script src="./js/core/state.js"></script>
<script src="./js/core/router.js"></script>
<script src="./js/core/calendar-popup.js"></script>
<script src="./js/core/hide.js"></script>
<script src="./js/core/lookups.js"></script>
<script src="./js/ui/toast.js"></script>
<script src="./js/ui/nav.js"></script>
<script src="./js/ui/theme.js"></script>
<script src="./js/ui/table.js"></script>
<script src="./js/ui/form.js"></script>
<script src="./js/ui/share.js"></script>
<script src="./js/ui/observers.js"></script>

<script>
var out = [];
function log(label, ok, extra) {
    out.push((ok ? '✅' : '❌') + ' ' + label + (extra ? ' → ' + extra : ''));
}
try {
    /* Core */
    log('DB',                       typeof DB !== 'undefined');
    log('goToPage',                 typeof goToPage === 'function');
    log('attachDatePickers',        typeof attachDatePickers === 'function');
    log('getHideState',             typeof getHideState === 'function');
    log('getAccountLabel',          typeof getAccountLabel === 'function');
    log('printHtmlReport',          typeof printHtmlReport === 'function');

    /* UI */
    log('showToast',                typeof showToast === 'function');
    log('openSidebar',              typeof openSidebar === 'function');
    log('applyTheme',               typeof applyTheme === 'function');
    log('makeTableResizable',       typeof makeTableResizable === 'function');
    log('closeAllTabs',             typeof closeAllTabs === 'function');
    log('autoAttachReportHelpers',  typeof autoAttachReportHelpers === 'function');
    log('shareAsText',              typeof shareAsText === 'function');
    log('shareAsImage',             typeof shareAsImage === 'function');
    log('loadHtml2Canvas',          typeof loadHtml2Canvas === 'function');
    log('buildShareButtons',        typeof buildShareButtons === 'function');

    /* تست‌های واقعی */
    setTimeout(function () {
        buildShareButtons();
        var shareBtns = document.querySelectorAll('.share-btn');
        log('دکمه‌های اشتراک‌گذاری', shareBtns.length > 0, shareBtns.length + ' دکمه');
        showToast('🎉 تست کامل لایه UI موفق');
        document.getElementById('result').innerHTML = out.join('<br>');
    }, 1500);
} catch (e) {
    document.getElementById('result').innerHTML = out.join('<br>') + '<br>❌ ' + e.message;
}
</script>
</body>
</html>
