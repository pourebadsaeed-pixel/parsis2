<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تست لایه Core</title>
</head>
<body>

<h1>تست لایه Core</h1>
<div id="result">در حال اجرا...</div>

<script src="./js/core/db.js" onerror="document.getElementById('result').innerHTML += '<br>❌ db.js لود نشد'"></script>
<script src="./js/core/constants.js" onerror="document.getElementById('result').innerHTML += '<br>❌ constants.js لود نشد'"></script>
<script src="./js/core/utils.js" onerror="document.getElementById('result').innerHTML += '<br>❌ utils.js لود نشد'"></script>
<script src="./js/core/state.js" onerror="document.getElementById('result').innerHTML += '<br>❌ state.js لود نشد'"></script>
<script src="./js/core/router.js" onerror="document.getElementById('result').innerHTML += '<br>❌ router.js لود نشد'"></script>

<script>
var out = [];
function log(label, ok, extra) {
    out.push((ok ? '✅' : '❌') + ' ' + label + (extra ? ' → ' + extra : ''));
}

try {
    log('DB', typeof DB !== 'undefined');
    log('LS_KEYS', typeof LS_KEYS !== 'undefined');
    log('toFa', typeof toFa !== 'undefined');
    log('toJalali', typeof toJalali !== 'undefined');
    log('state', typeof state !== 'undefined');
    log('goToPage', typeof goToPage === 'function');
    log('updateTopbarPeriod', typeof updateTopbarPeriod === 'function');
    log('rerenderCurrentPage', typeof rerenderCurrentPage === 'function');
    log('getActiveFiscalYearStart', typeof getActiveFiscalYearStart === 'function');

    if (typeof state !== 'undefined') {
        log('state.theme', true, state.theme);
        log('state.widgets count', true, Object.keys(state.widgets || {}).length);
    }

    if (typeof DB !== 'undefined') {
        DB.save('test_key', { hello: 'world' });
        var loaded = DB.load('test_key', null);
        log('DB.save/load', loaded && loaded.hello === 'world');
        DB.remove('test_key');
    }

    if (typeof toFa === 'function') log('toFa(1234)', toFa(1234) === '۱۲۳۴');

    if (typeof toJalali === 'function') {
        var j = toJalali(2024, 1, 1);
        log('toJalali(2024/1/1)', j[0] === 1402 && j[1] === 10 && j[2] === 11, j.join('/'));
    }

    if (typeof getActiveFiscalYearStart === 'function') {
        log('getActiveFiscalYearStart', true, '(تابع سالم)');
    }

    document.getElementById('result').innerHTML = out.join('<br>');
} catch (e) {
    document.getElementById('result').innerHTML =
        out.join('<br>') + '<br><br>❌ خطا: ' + (e.message || e) +
        '<br><pre style="color:red;direction:ltr">' + (e.stack || '') + '</pre>';
}
</script>
</body>
</html>
